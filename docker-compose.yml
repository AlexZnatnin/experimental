services:
  db:
    image: postgres:16-alpine
    container_name: helpdesk_db
    environment:
      - POSTGRES_DB=helpdesk
      - POSTGRES_USER=helpdesk_user
      - POSTGRES_PASSWORD=helpdesk_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: helpdesk_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: helpdesk_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: helpdesk_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-prod
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - POSTGRES_DB=helpdesk
      - POSTGRES_USER=helpdesk_user
      - POSTGRES_PASSWORD=helpdesk_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_TICKET_EVENTS=ticket_events
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  relay:
    build: .
    container_name: helpdesk_relay
    command: >
      sh -c "sleep 15 && python manage.py run_relay --interval 5"
    volumes:
      - .:/app
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-prod
      - DJANGO_DEBUG=True
      - POSTGRES_DB=helpdesk
      - POSTGRES_USER=helpdesk_user
      - POSTGRES_PASSWORD=helpdesk_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_TICKET_EVENTS=ticket_events
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consumer:
    build: .
    container_name: helpdesk_consumer
    command: >
      sh -c "sleep 20 && python manage.py run_consumer"
    volumes:
      - .:/app
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-prod
      - DJANGO_DEBUG=True
      - POSTGRES_DB=helpdesk
      - POSTGRES_USER=helpdesk_user
      - POSTGRES_PASSWORD=helpdesk_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_TICKET_EVENTS=ticket_events
      - KAFKA_CONSUMER_GROUP=ticket_processors
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data: